# Nginx configuration for the HS-Snake promo website.
#
# Serves the static site from /usr/share/nginx/html (built from www/site/).

error_log /dev/stderr warn;

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile    on;
    tcp_nopush  on;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    server {
        listen 80;
        listen [::]:80;
        server_name www;

        root /usr/share/nginx/html;
        index index.html;

        # Health check (mirrors docker/cache/nginx.conf's pattern)
        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # HSJeeves installers: a host folder mounted read-only (see docker-compose.yml), NOT part of the image.
        # versions.json (written by HSJeeves' installer\publish.ps1) lists the kept versions; never cache it.
        location /downloads/ {
            default_type application/octet-stream;
            types {
                application/json json;
                text/plain       sha256;
                application/octet-stream exe;
            }
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri =404;
        }

        # Long-lived caching for images
        location /img/ {
            expires 7d;
        }

        # Shorter caching for CSS/JS
        location ~* \.(css|js)$ {
            expires 1d;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
